[package]
name = "spark-agent-adapter"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false
path = "src/lib.rs"

[dependencies]
agent-client-protocol = { version = "=5.3.0", features = ["unstable_end_turn_token_usage"] }
attractor-core = { path = "../attractor-core" }
spark-common = { path = "../spark-common" }
spark-storage = { path = "../spark-storage" }
unified-llm-adapter = { path = "../unified-llm-adapter" }
jsonschema = { version = "0.46", default-features = false }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
glob = "0.3"
regex = "1.10"
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["rt", "net", "process", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
attractor-dsl = { path = "../attractor-dsl" }
filetime = "0.2"
