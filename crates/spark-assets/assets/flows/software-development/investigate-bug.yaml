schema_version: '1'
id: investigate_bug
title: Investigate Bug
description: Investigate a reported defect, adversarially verify the diagnosis, propose a repair plan, and adversarially verify the plan. The run ends with the verified diagnosis and plan.
goal: Investigate a reported defect, adversarially verify the diagnosis, propose a repair plan, and adversarially verify the plan. The run ends with the verified diagnosis and plan.
inputs:
- key: context.request.objective
  label: Bug Report
  type: string
  description: The observed defect, including reproduction hints and expected behavior when known.
  required: true
- key: context.request.target_paths
  label: Target Paths
  type: string[]
  required: false
- key: context.request.validation_command
  label: Validation Command
  type: string
  required: false
defaults:
  fidelity: summary:high
  llm_provider: codex
  llm_model: gpt-6-astra
metadata:
  software_development:
    launcher: true
nodes:
  start:
    kind: start
    label: Start
    config:
      kind: start
  investigate:
    kind: agent_task
    label: Investigate
    config:
      kind: agent_task
      prompt: 'Investigate the defect described by context.request.objective in the current checkout without changing any files. Reproduce or characterize the failure through real interfaces (tests, CLI, API, observable state), trace the failing execution path, and identify the root cause and affected surfaces. If context.review.required_changes is present, it lists gaps a verifier found in your previous investigation; close them. Prefer deterministic evidence: commands you ran, files and line ranges you inspected, observed versus expected behavior. Do not propose or implement fixes yet. Respond with ONLY a JSON status envelope whose context_updates set context.investigation.summary (the diagnosis), context.investigation.root_cause (the specific defective code path), and context.investigation.evidence (the concrete evidence trail: commands, outputs, file references).'
    contracts:
      response: status_envelope
      reads_context:
      - context.request.objective
      - context.request.target_paths
      - context.review.required_changes
      writes_context:
      - context.investigation.summary
      - context.investigation.root_cause
      - context.investigation.evidence
  verify_investigation:
    kind: agent_task
    label: Verify Investigation
    config:
      kind: agent_task
      prompt: 'You are the adversarial verifier of a bug investigation. Treat context.investigation.summary, context.investigation.root_cause, and context.investigation.evidence as untrusted claims and actively try to refute them against the repository without changing any files. Re-run or independently reproduce the cited evidence where practical; check that the claimed root cause is on the real execution path of the reported defect and not merely nearby suspicious code; look for alternative causes the investigation did not rule out. Grade the evidence: strong (deterministic reproduction, direct inspection), medium (clear code-path reading), weak (assertion, absence of failure). Return outcome success only when the diagnosis survives refutation with strong or sufficient medium evidence for the root cause. On failure, set context_updates for context.review.required_changes describing precisely what is unproven, contradicted, or unexamined so the investigator can close the gaps. On success, set context_updates clearing context.review.required_changes to null so no stale gap list survives in the run state. Respond with ONLY a JSON status envelope.'
    runtime:
      error_policy: continue
    contracts:
      response: status_envelope
      reads_context:
      - context.request.objective
      - context.investigation.summary
      - context.investigation.root_cause
      - context.investigation.evidence
      writes_context:
      - context.review.required_changes
  propose_plan:
    kind: agent_task
    label: Propose Repair Plan
    config:
      kind: agent_task
      prompt: 'Turn the verified diagnosis (context.investigation.summary, context.investigation.root_cause, context.investigation.evidence) into one decision-complete repair plan without changing any files. The plan must state: the bounded objective of the fix, the target paths, explicit acceptance criteria including a regression check that reproduces the original defect, compatibility constraints, and the truthful validation command (use context.request.validation_command when provided, otherwise discover it from the repository). Prefer the smallest coherent fix over redesign. If context.review.required_changes is present, it lists gaps a verifier found in your previous plan; close them. Respond with ONLY a JSON status envelope whose context_updates set context.plan.objective (a self-contained task statement an implementer can execute without reading this run) and context.plan.validation_command.'
    contracts:
      response: status_envelope
      reads_context:
      - context.investigation.summary
      - context.investigation.root_cause
      - context.investigation.evidence
      - context.request.validation_command
      - context.review.required_changes
      writes_context:
      - context.plan.objective
      - context.plan.validation_command
  verify_plan:
    kind: agent_task
    label: Verify Repair Plan
    config:
      kind: agent_task
      prompt: 'You are the adversarial verifier of a repair plan. Treat context.plan.objective and context.plan.validation_command as untrusted claims and actively try to refute them against the verified diagnosis (context.investigation.summary, context.investigation.root_cause, context.investigation.evidence) and the repository without changing any files. Check that the plan fixes the root cause rather than a symptom, that its target paths cover every affected surface, that its acceptance criteria include a regression check reproducing the original defect, that it does not break compatibility or callers it does not mention, that it is the smallest coherent fix, and that the validation command exists and exercises the change. Return outcome success only when the plan survives refutation and an implementer could execute it without reading this run. On failure, set context_updates for context.review.required_changes describing precisely what is wrong, missing, or unproven so the planner can revise the plan. On success, set context_updates clearing context.review.required_changes to null so no stale gap list survives in the run state. Respond with ONLY a JSON status envelope.'
    runtime:
      error_policy: continue
    contracts:
      response: status_envelope
      reads_context:
      - context.request.objective
      - context.investigation.summary
      - context.investigation.root_cause
      - context.investigation.evidence
      - context.plan.objective
      - context.plan.validation_command
      writes_context:
      - context.review.required_changes
  done:
    kind: exit
    label: Done
    config:
      kind: exit
      result_summary: true
edges:
- from: start
  to: investigate
- from: investigate
  to: verify_investigation
  condition: outcome=success
- from: verify_investigation
  to: propose_plan
  label: Verified
  condition: outcome=success
- from: verify_investigation
  to: investigate
  label: Gaps Found
  condition: outcome=fail
- from: propose_plan
  to: verify_plan
  condition: outcome=success
- from: verify_plan
  to: done
  label: Verified
  condition: outcome=success
- from: verify_plan
  to: propose_plan
  label: Gaps Found
  condition: outcome=fail
