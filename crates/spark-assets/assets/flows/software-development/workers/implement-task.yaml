schema_version: '1'
id: software_development_implement_task
title: Implement Task
description: Hidden reusable software-development worker.
goal: Implement, test, self-review, and commit the bounded task inside the current isolated worktree.
defaults:
  fidelity: summary:high
  llm_provider: codex
  llm_model: gpt-6-astra
metadata:
  software_development:
    launcher: false
    worker: true
nodes:
  start:
    label: Start
    kind: start
    config:
      kind: start
  work:
    label: Implement
    kind: agent_task
    config:
      kind: agent_task
      prompt: 'Implement the task described by context.task.objective in the current working directory, which is an isolated git worktree on a dedicated branch. Inspect the repository, make the smallest coherent implementation, and test and review observable behavior; context.task.validation_command names the project validation gate. If context.review.required_changes is present, it is mandatory feedback from the gatekeeper evaluation of your previous attempt; address it directly before finishing. When the task source is an approved change-request document under changes/<CR-id>/, also write changes/<CR-id>/result.md summarizing the shipped result locally. Respect repository ignore rules; do not force-add ignored change requests, results, or evidence. After testing and self-review, commit the task changes on the existing worktree branch with a descriptive message. On subsequent implementation iterations, create a new commit for the fixes; do not amend or rewrite earlier commits. If there are no changes, do not create an empty commit. Do not push, merge, create branches or worktrees, or clean anything up; the parent flow evaluates, validates, finalizes, and releases the workspace. Respond with ONLY a JSON status envelope.'
    contracts:
      response: status_envelope
      reads_context:
      - context.task.objective
      - context.task.validation_command
      - context.review.summary
      - context.review.required_changes
  done:
    label: Done
    kind: exit
    config:
      kind: exit
      result_summary: true
edges:
- from: start
  to: work
- from: work
  to: done
  condition: outcome=success
