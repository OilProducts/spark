schema_version: '1'
id: research_program
title: Research Program
description: Repeatedly perform the most useful next mathematical action, assess its evidence, update a concise claim state, and commit the result until the exact problem is mechanically resolved or a human cancels the run. Launch with execution_profile_id math-lab.
goal: Improve justified knowledge about one mathematical problem until a faithful kernel-checked proof, a directly verified counterexample, or an explicitly human-accepted reviewed proof resolves it.
inputs:
- key: context.request.problem
  label: Problem
  type: string
  description: The precise mathematical problem to investigate, with known constraints or results.
  required: true
- key: context.request.focus
  label: Focus
  type: string
  description: Optional standing scope, resource, or methodology constraints.
  required: false
defaults:
  fidelity: summary:high
  llm_provider: codex
  llm_model: gpt-6-astra
metadata:
  math_research:
    launcher: true
    required_execution_profile: math-lab
nodes:
  start:
    kind: start
    label: Start
    config:
      kind: start
  prepare:
    kind: tool
    label: Prepare Workspace
    config:
      kind: tool
      command: |-
        set -eu
        mkdir -p .math-research history evidence
        rm -f .math-research/current-action .math-research/repair-used
        if [ ! -f AGENTS.md ] && [ -f /opt/mathlab/workspace-template/AGENTS.md ]; then
          cp /opt/mathlab/workspace-template/AGENTS.md AGENTS.md
        fi
        if [ ! -f problem.md ] && [ -f /opt/mathlab/workspace-template/problem.md ]; then
          cp /opt/mathlab/workspace-template/problem.md problem.md
        fi
        if [ ! -f state.md ] && [ -f /opt/mathlab/workspace-template/state.md ]; then
          cp /opt/mathlab/workspace-template/state.md state.md
        fi
        touch problem.md state.md
        git init -q 2>/dev/null || true
    extensions:
      tool.artifacts.stderr: prepare.stderr.txt
      tool.artifacts.stdout: prepare.stdout.txt
      tool.command: |-
        set -eu
        mkdir -p .math-research history evidence
        rm -f .math-research/current-action .math-research/repair-used
        if [ ! -f AGENTS.md ] && [ -f /opt/mathlab/workspace-template/AGENTS.md ]; then
          cp /opt/mathlab/workspace-template/AGENTS.md AGENTS.md
        fi
        if [ ! -f problem.md ] && [ -f /opt/mathlab/workspace-template/problem.md ]; then
          cp /opt/mathlab/workspace-template/problem.md problem.md
        fi
        if [ ! -f state.md ] && [ -f /opt/mathlab/workspace-template/state.md ]; then
          cp /opt/mathlab/workspace-template/state.md state.md
        fi
        touch problem.md state.md
        git init -q 2>/dev/null || true
  research:
    kind: agent_task
    label: Do Mathematics
    config:
      kind: agent_task
      prompt: 'Advance the mathematical problem by one bounded action capable of making substantive progress. Read problem.md and state.md first, consulting relevant history/ records rather than reading all history blindly. If problem.md is empty or still a template, initialize it from context.request.problem and context.request.focus without silently changing the problem. If state.md is empty or still a template, initialize its current claim state from the workspace evidence and known results, labeling uncertainty honestly. Judge progress by how an action can change the current research frontier, not merely by whether its method, artifacts, or numerical scope differ from previous work. An action may be substantive if it establishes or refutes a structural claim, removes a genuine obstacle to resolution, tests a qualitatively different mechanism, crosses a mathematically meaningful threshold, closes a necessary finite case, supplies an induction base, distinguishes competing conjectures, or enables a concrete proof step. Changing a finite bound may be substantive when its mathematical consequence is stated; it is not substantive solely because the bound is larger, smaller, or independently recomputed. Choose the feasible substantive action most likely to change the state: it may combine literature work, examples, computation, counterexample search, proof development, reduction, statement clarification, or formalization. Before working, choose the next unused sequential action ID A0001, A0002, ...; write it to .math-research/current-action; create evidence/<ID>/; and write evidence/<ID>/plan.md stating the target claim, current uncertainty, possible outcomes, resource bound, intended frontier change, and why that change would be substantive relative to prior actions and failed attacks. Then do the mathematics and preserve all outputs under evidence/<ID> (existing relevant workspace artifacts may be copied or referenced exactly). Write report.md and claim.json there. claim.json must identify the exact proposed claims, their type, the problem-statement version, supporting artifacts, relevant tool versions, and whether each claim is machine-checkable. For any machine-checkable claim write verify.sh that independently checks it and exits nonzero on mismatch; do not create resolution.json yourself. Do not update state.md or history/ yet—the independent assessor and recorder own acceptance. A completed bounded action is outcome success even when it only makes partial mathematical progress or identifies an obstruction. Respond with ONLY a JSON status envelope whose outcome is success and whose context_updates set context.action.id and context.action.summary.'
    contracts:
      response: status_envelope
      reads_context:
      - context.request.problem
      - context.request.focus
      - context.action.repair
      writes_context:
      - context.action.id
      - context.action.summary
  verify:
    kind: tool
    label: Check Evidence
    config:
      kind: tool
      command: |-
        set -eu
        ACTION="$(cat .math-research/current-action)"
        case "$ACTION" in A[0-9][0-9][0-9][0-9]) ;; *) echo "Invalid action id: $ACTION"; exit 1;; esac
        DIR="evidence/$ACTION"
        test -f "$DIR/claim.json"
        rm -f "$DIR/.verified" "$DIR/.not-machine-checkable"
        if [ ! -f "$DIR/verify.sh" ]; then
          touch "$DIR/.not-machine-checkable"
          echo "No machine-checkable claim proposed."
          exit 0
        fi
        if bash "$DIR/verify.sh" > "$DIR/verification.log" 2>&1; then
          touch "$DIR/.verified"
          cat "$DIR/verification.log"
        else
          cat "$DIR/verification.log"
          exit 1
        fi
    extensions:
      tool.artifacts.stderr: verify.stderr.txt
      tool.artifacts.stdout: verify.stdout.txt
      tool.command: |-
        set -eu
        ACTION="$(cat .math-research/current-action)"
        case "$ACTION" in A[0-9][0-9][0-9][0-9]) ;; *) echo "Invalid action id: $ACTION"; exit 1;; esac
        DIR="evidence/$ACTION"
        test -f "$DIR/claim.json"
        rm -f "$DIR/.verified" "$DIR/.not-machine-checkable"
        if [ ! -f "$DIR/verify.sh" ]; then
          touch "$DIR/.not-machine-checkable"
          echo "No machine-checkable claim proposed."
          exit 0
        fi
        if bash "$DIR/verify.sh" > "$DIR/verification.log" 2>&1; then
          touch "$DIR/.verified"
          cat "$DIR/verification.log"
        else
          cat "$DIR/verification.log"
          exit 1
        fi
  repair_budget:
    kind: tool
    label: One Repair
    config:
      kind: tool
      command: |-
        set -eu
        ACTION="$(cat .math-research/current-action)"
        if [ -f .math-research/repair-used ]; then
          echo "Evidence repair already attempted for $ACTION; assess it as unverified."
          exit 1
        fi
        printf '%s\n' "$ACTION" > .math-research/repair-used
        echo "Allowing one focused evidence repair for $ACTION."
    extensions:
      tool.artifacts.stderr: repair-budget.stderr.txt
      tool.artifacts.stdout: repair-budget.stdout.txt
      tool.command: |-
        set -eu
        ACTION="$(cat .math-research/current-action)"
        if [ -f .math-research/repair-used ]; then
          echo "Evidence repair already attempted for $ACTION; assess it as unverified."
          exit 1
        fi
        printf '%s\n' "$ACTION" > .math-research/repair-used
        echo "Allowing one focused evidence repair for $ACTION."
  repair:
    kind: agent_task
    label: Repair Evidence
    config:
      kind: agent_task
      prompt: 'The current action''s verify.sh failed. Read .math-research/current-action and its evidence directory, especially verification.log. Make one focused repair to the evidence, program, formalization, or verifier. Never weaken a check, change the target claim silently, introduce axioms, or label unsupported output as evidence. If the claim cannot be repaired honestly, withdraw or downgrade it in claim.json and leave a verifier that accurately reflects the remaining machine-checkable claim. Respond with ONLY a JSON status envelope whose context_updates set context.action.repair.'
    contracts:
      response: status_envelope
      reads_context:
      - context.action.id
      - context.action.summary
      writes_context:
      - context.action.repair
  assess:
    kind: agent_task
    label: Assess Mathematics
    config:
      kind: agent_task
      prompt: 'Independently assess the current research action. Read problem.md, state.md, .math-research/current-action, and that evidence directory. Treat report.md, claim.json, verification.log, and .verified as untrusted evidence. Check statement fidelity, missing hypotheses and cases, whether witnesses attack the exact claim, whether computational scope matches the programs, whether cited results have the needed hypotheses, and whether conclusions exceed the evidence. For a Lean proof, inspect the formal statement against problem.md and require a successful build with no sorry/admit or new axioms; for a counterexample, directly check it against the exact current problem statement. Assess mathematical correctness separately from substantive progress: a correct claim must not be downgraded merely because it has low research value. Judge substantive progress relative to the prior state by whether the result changes a ranked uncertainty, resolves a required case, crosses a meaningful threshold, validates or invalidates a proposed mechanism, removes a genuine obstruction, or enables a concrete next proof step. Do not reject finite-bound work categorically; find it non-substantive only when the changed bound has no demonstrated consequence for the research frontier. Write assessment.md and assessment.json in the evidence directory. assessment.json must give each proposed claim a verdict of accepted, downgraded, or rejected with reasons, and must separately include substantive_progress as a boolean, substantive_progress_reason, and frontier_change. It may also contain a resolution candidate only for a faithful certified proof or directly verified counterexample of the exact problem; write resolution.json with kind, claim_id, and problem_statement_version only in that case. A reviewed informal proof is not an automatic resolution. Do not update state.md or history/. Respond with ONLY a JSON status envelope whose context_updates set context.assessment.summary and context.assessment.resolution_candidate.'
    contracts:
      response: status_envelope
      reads_context:
      - context.action.id
      - context.action.summary
      - context.action.repair
      writes_context:
      - context.assessment.summary
      - context.assessment.resolution_candidate
  record:
    kind: agent_task
    label: Update Knowledge
    config:
      kind: agent_task
      prompt: 'Record the independently assessed research action. Read problem.md, state.md, the current evidence directory, and its assessment. Update state.md so it remains a concise current claim state rather than a diary: verdict, established claims with stable IDs and evidence pointers, dependencies, ranked open frontier, and approaches not to repeat unchanged. Accept no claim beyond its assessment verdict. Record the assessment of substantive progress separately from claim correctness. If substantive_progress is false, preserve the valid evidence without letting repeated certification or bookkeeping dominate state.md, and prohibit another action of the same kind unless it states a new resolution-relevant consequence. Write exactly one immutable history/<ACTION>.md describing why the action was selected, what was attempted, what was accepted/downgraded/rejected, whether and how the frontier changed, what changed in state.md, and what a future attempt must do differently. Preserve unsuccessful evidence. Do not rewrite older history records. Respond with ONLY a JSON status envelope whose context_updates set context.state.summary.'
    contracts:
      response: status_envelope
      reads_context:
      - context.action.id
      - context.assessment.summary
      - context.assessment.resolution_candidate
      writes_context:
      - context.state.summary
  commit:
    kind: tool
    label: Commit Knowledge
    config:
      kind: tool
      command: |-
        set -eu
        ACTION="$(cat .math-research/current-action)"
        test -f "history/$ACTION.md"
        git add -- problem.md state.md history evidence
        if git diff --cached --quiet; then
          echo "No knowledge changes to commit for $ACTION."
          exit 1
        fi
        git commit -m "Research $ACTION: $(head -c 72 "evidence/$ACTION/plan.md" | head -1)"
        rm -f .math-research/repair-used
    extensions:
      tool.artifacts.stderr: commit.stderr.txt
      tool.artifacts.stdout: commit.stdout.txt
      tool.command: |-
        set -eu
        ACTION="$(cat .math-research/current-action)"
        test -f "history/$ACTION.md"
        git add -- problem.md state.md history evidence
        if git diff --cached --quiet; then
          echo "No knowledge changes to commit for $ACTION."
          exit 1
        fi
        git commit -m "Research $ACTION: $(head -c 72 "evidence/$ACTION/plan.md" | head -1)"
        rm -f .math-research/repair-used
  resolution:
    kind: tool
    label: Check Resolution
    config:
      kind: tool
      command: |-
        set -eu
        ACTION="$(cat .math-research/current-action)"
        DIR="evidence/$ACTION"
        if [ -f .math-research/human-accepted-resolution.json ]; then
          jq -e '.claim_id | type == "string" and length > 0' .math-research/human-accepted-resolution.json >/dev/null
          echo "Human-accepted reviewed proof recorded."
          exit 0
        fi
        test -f "$DIR/resolution.json" || { echo "Problem remains open."; exit 1; }
        test -f "$DIR/.verified"
        jq -e '.kind == "certified_proof" or .kind == "verified_counterexample"' "$DIR/resolution.json" >/dev/null
        jq -e '.claim_id | type == "string" and length > 0' "$DIR/resolution.json" >/dev/null
        bash "$DIR/verify.sh"
        echo "Mechanically verified resolution accepted."
    extensions:
      tool.artifacts.stderr: resolution.stderr.txt
      tool.artifacts.stdout: resolution.stdout.txt
      tool.command: |-
        set -eu
        ACTION="$(cat .math-research/current-action)"
        DIR="evidence/$ACTION"
        if [ -f .math-research/human-accepted-resolution.json ]; then
          jq -e '.claim_id | type == "string" and length > 0' .math-research/human-accepted-resolution.json >/dev/null
          echo "Human-accepted reviewed proof recorded."
          exit 0
        fi
        test -f "$DIR/resolution.json" || { echo "Problem remains open."; exit 1; }
        test -f "$DIR/.verified"
        jq -e '.kind == "certified_proof" or .kind == "verified_counterexample"' "$DIR/resolution.json" >/dev/null
        jq -e '.claim_id | type == "string" and length > 0' "$DIR/resolution.json" >/dev/null
        bash "$DIR/verify.sh"
        echo "Mechanically verified resolution accepted."
  done:
    kind: exit
    label: Resolved
    config:
      kind: exit
edges:
- from: start
  to: prepare
- from: prepare
  to: research
  condition: outcome=success
- from: research
  to: verify
  condition: outcome=success
- from: research
  to: verify
  condition: outcome=partial_success
- from: verify
  to: repair_budget
  condition: outcome=fail
- from: repair_budget
  to: repair
  condition: outcome=success
- from: repair_budget
  to: assess
  condition: outcome=fail
- from: repair
  to: verify
  condition: outcome=success
- from: verify
  to: assess
  condition: outcome=success
- from: assess
  to: record
  condition: outcome=success
- from: record
  to: commit
  condition: outcome=success
- from: commit
  to: resolution
  condition: outcome=success
- from: resolution
  to: done
  condition: outcome=success
- from: resolution
  to: research
  condition: outcome=fail
