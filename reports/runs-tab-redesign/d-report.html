<!doctype html>
<html><head><meta charset="utf-8"><title>D · Inbox + run report</title>
<link rel="stylesheet" href="shared.css">
<style>
.wrap { flex: 1; overflow: auto; }
.page { max-width: 1080px; margin: 0 auto; padding: 22px 28px 60px; }
.inbox h1 { font-size: 20px; margin: 0 0 4px; }
.attn { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0 22px; }
.attn .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.attn .card:hover { border-color: #a1a1aa; }
.attn .card .k { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: #fcfcfc; }
td { padding: 9px 12px; border-bottom: 1px solid #f4f4f5; vertical-align: top; }
tr.r { cursor: pointer; } tr.r:hover td { background: var(--soft); }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar input { flex: 1; max-width: 360px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; }
.crumb { color: var(--muted); margin-bottom: 10px; cursor: pointer; }
.hero { display: flex; gap: 14px; align-items: flex-start; }
.hero h1 { font-size: 22px; margin: 0; line-height: 1.25; }
.hero .actions { margin-left: auto; display: flex; gap: 6px; }
.facts { display: flex; gap: 22px; margin: 14px 0 18px; flex-wrap: wrap; }
.facts div b { display: block; font-size: 15px; } .facts div span { color: var(--muted); font-size: 12px; }
.cols { display: grid; grid-template-columns: 1fr 300px; gap: 22px; }
.box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.box h3 { margin: 0 0 8px; font-size: 14px; }
.story { position: relative; padding-left: 22px; }
.story::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.beat { position: relative; margin-bottom: 14px; }
.beat::before { content: ''; position: absolute; left: -21px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #a1a1aa; }
.beat.ok::before { border-color: var(--ok); background: var(--ok-bg); } .beat.warn::before { border-color: var(--warn); background: var(--warn-bg); } .beat.err::before { border-color: var(--err); background: var(--err-bg); }
.beat .h { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.beat .h .t { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
.beat p { margin: 4px 0 0; line-height: 1.5; color: #3f3f46; }
.beat .ev { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.beat .ev a { font-size: 11.5px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; color: var(--fg); cursor: pointer; background: var(--bg); }
.beat .ev a:hover { border-color: var(--sel-b); }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 520px; background: var(--card); border-left: 1px solid var(--border); box-shadow: -8px 0 24px #0001; padding: 18px 20px; overflow: auto; transform: translateX(100%); transition: transform .15s; z-index: 5; }
.drawer.open { transform: none; }
</style></head>
<body>
<div class="proto-banner"><b>Proposal D · Inbox + run report</b><span>Runs open as an inbox sorted by what needs you. A run reads as a report: outcome, a short account of what happened, and evidence on demand. Raw events are one click deeper.</span><a href="index.html" style="margin-left:auto">← Audit and all proposals</a></div>
<script src="data.js"></script>
<script>document.write(renderNav())</script>
<div class="wrap"><div class="page" id="page"></div></div>
<div class="drawer" id="drawer"></div>
<script>
const P = document.getElementById('page'), DR = document.getElementById('drawer')
const statusPill = (s) => ({ completed: '<span class="pill ok">Completed</span>', failed: '<span class="pill err">Failed</span>', running: '<span class="pill run">Running</span>', waiting: '<span class="pill warn">Needs you</span>', canceled: '<span class="pill neutral">Canceled</span>' }[s])
function inbox() {
  P.innerHTML = `<div class="inbox"><h1>Runs</h1><div class="muted">spark · 213 runs this month</div>
  <div class="attn">
    <div class="card" style="border-color:#fcd34d;background:#fffbeb"><div class="k" style="color:var(--warn)">Needs you · 1</div><div style="margin-top:6px;font-weight:500">Mission: tighten run hand-offs</div><div class="small muted">Waiting 12m on “Which gate should own retries?”</div><button class="btn primary" style="margin-top:8px">Answer</button></div>
    <div class="card"><div class="k" style="color:var(--run)">Running · 1</div><div style="margin-top:6px;font-weight:500">CR-2026-0131 · Triggers deliver events</div><div class="small muted">Pass 2 · Evaluate · 27m elapsed</div><div class="share" style="height:4px;background:var(--soft);border-radius:2px;margin-top:10px"><div style="width:55%;height:100%;background:var(--run);border-radius:2px"></div></div></div>
    <div class="card"><div class="k" style="color:var(--err)">Failed this week · 1</div><div style="margin-top:6px;font-weight:500">CR-2026-0119 · Webhook dispatch gate</div><div class="small muted">Validate failed 3×: exit 101 in webhook_dispatch</div></div>
  </div>
  <div class="toolbar"><input placeholder="Search objective, CR, flow, run id…"/><span class="chip on">All</span><span class="chip">Completed</span><span class="chip">Failed</span><span class="chip">Canceled</span><span class="chip">Show child runs</span></div>
  <table><thead><tr><th style="width:44%">Run</th><th>Flow</th><th>Started</th><th>Duration</th><th>Loops</th><th>Status</th></tr></thead><tbody>
  ${RUNS.map(r => `<tr class="r" ${r.current ? 'data-open="1"' : ''}><td><div style="font-weight:500">${esc(r.title)}</div><div class="tiny muted mono">${r.id}</div></td><td>${r.flow}</td><td>${r.when}</td><td>${r.dur}</td><td>${r.passes ? `${r.passes} passes` : '—'}</td><td>${statusPill(r.status)}</td></tr>`).join('')}
  </tbody></table><p class="small muted">Click <b>CR-2026-0127</b> to open its report.</p></div>`
  P.querySelectorAll('tr[data-open]').forEach(el => el.onclick = report)
}
const beats = [
  { cls: 'ok', h: 'Set up', t: '12:58 · 26s', p: 'Normalized request.md into an objective, acceptance criteria and <code>just test</code>. Created an isolated worktree on <code>spark/implement-change/run-18d93c05</code>.', ev: [1, 2] },
  { cls: 'warn', h: 'Pass 1 · review requested changes', t: '12:59 · 29m', p: 'Implemented effort levels, catalog metadata, Anthropic discovery cache and picker options (child run, 25m, 12.3M tokens). <b>Review found</b> that chat/workflow paths lowercased effort strings before dispatch.', ev: [3, 4] },
  { cls: 'err', h: 'Pass 2 · approved, then validation failed', t: '13:28 · 17m', p: 'Stopped lowercasing and added a regression test; review approved. <code>just test</code> then exited 1. Diagnosis: a <b>flaky socket test</b> (WouldBlock, os error 35) that passes on its own. The run routed back to fix the harness.', ev: [5, 6, 7, 9] },
  { cls: 'warn', h: 'Pass 3 · review requested changes', t: '13:45 · 8m', p: 'Stabilized the captured-connection helper. <b>Review found</b> that <code>models.rs:79</code> reads only the process env, so Anthropic endpoints and credentials in spark.toml were ignored.', ev: [10, 11] },
  { cls: 'ok', h: 'Pass 4 · approved and validated', t: '13:53 · 12m', p: 'Discovery now uses the execution provider resolver; the second socket helper is fixed. Review approved and <code>just test</code> passed.', ev: [12, 13, 14] },
  { cls: 'ok', h: 'Committed', t: '14:05', p: 'Commit <code>6debdc97</code> on the run branch. Worktree cleaned up. Nothing was merged or pushed.', ev: [15, 16] },
]
function report() {
  P.innerHTML = `<div class="crumb" id="back">← Runs</div>
  <div class="hero"><div><div class="muted small">${RUN.flowLabel} · <span class="mono">${RUN.id}</span></div><h1>${RUN.objective}</h1></div>
    <div class="actions"><button class="btn">Open diff</button><button class="btn">Re-run</button><button class="btn">⋯</button></div></div>
  <div class="facts"><div><b style="color:var(--ok)">Completed</b><span>outcome</span></div><div><b>1h 7m</b><span>Yesterday 12:58 → 14:05</span></div><div><b>4 passes</b><span>2 review rejections, 1 flaky validate</span></div><div><b>22.6M</b><span>tokens · unpriced model</span></div><div><b class="mono" style="font-size:14px">6debdc97</b><span>commit</span></div></div>
  <div class="cols"><div>
    <div class="box"><h3>What happened</h3><div class="story">${beats.map(b => `<div class="beat ${b.cls}"><div class="h">${b.h}<span class="t">${b.t}</span></div><p>${b.p}</p><div class="ev">${b.ev.map(i => { const x = EXECUTIONS[i]; return `<a data-i="${i}">${nodeById[x.node].label}${visitLabel(x) ? ' ' + visitNo(x) : ''} ${x.outcome === 'success' ? '✓' : '↺'}</a>` }).join('')}</div></div>`).join('')}</div></div>
    <div class="box"><h3>Result</h3>${RUN.result.map(([k, v]) => `<p style="margin:6px 0;line-height:1.5"><b>${k}:</b> ${v}</p>`).join('')}</div>
  </div><div>
    <div class="box"><h3>Review findings</h3><div class="small" style="line-height:1.5"><p style="margin:0 0 8px">1. Effort strings lowercased before dispatch. <span class="pill ok">fixed in pass 2</span></p><p style="margin:0 0 8px">2. Discovery ignores spark.toml provider config. <span class="pill ok">fixed in pass 4</span></p><p style="margin:0">3. Flaky WouldBlock in two socket test helpers. <span class="pill ok">fixed in passes 3–4</span></p></div></div>
    <div class="box"><h3>Inputs</h3><dl class="kv small"><dt>Request</dt><dd class="mono" style="word-break:break-all">CR-2026-0127…/request.md</dd><dt>Validate</dt><dd><code>just test</code></dd><dt>Model</dt><dd>${RUN.model}</dd><dt>Project</dt><dd>spark</dd></dl></div>
    <div class="box"><h3>Go deeper</h3><div class="small" style="display:flex;flex-direction:column;gap:6px"><a>Execution ledger (18 executions)</a><a>Trace timeline</a><a>Flow graph</a><a>Context (84 keys)</a><a>Artifacts (6)</a><a>Raw journal (70 events)</a></div></div>
  </div></div>`
  document.getElementById('back').onclick = inbox
  P.querySelectorAll('.ev a').forEach(el => el.onclick = () => openEx(+el.dataset.i))
}
function openEx(i) {
  const x = EXECUTIONS[i], o = OUTCOME[x.outcome]
  DR.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;font-size:16px">${nodeById[x.node].label}</h2>${visitLabel(x) ? `<span class="visit">visit ${visitLabel(x)}</span>` : ''}<span class="pill ${o.cls}">${outcomeLabel(x)}</span><button class="btn" style="margin-left:auto" id="x">✕</button></div>
  <div class="muted small" style="margin-top:4px">#${x.i} · ${x.s}–${x.e} · ${dur(x.s, x.e)}</div>
  ${x.summary ? `<div class="callout ${o.cls}" style="margin-top:12px">${esc(x.summary)}</div>` : ''}
  <div class="section-label">Transcript</div>${renderTranscript(x.i)}`
  DR.classList.add('open'); document.getElementById('x').onclick = () => DR.classList.remove('open')
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') DR.classList.remove('open') })
location.hash === '#inbox' ? inbox() : report()
</script>
</body></html>
