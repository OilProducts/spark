<!doctype html>
<html><head><meta charset="utf-8"><title>E · Combined: visit list + graph</title>
<link rel="stylesheet" href="shared.css">
<style>
.body { flex: 1; display: flex; min-height: 0; position: relative; }
.rail { width: 44px; border-right: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 8px; flex-shrink: 0; }
.rail button { width: 30px; height: 30px; padding: 0; font-size: 14px; }
.runs-overlay { position: absolute; left: 44px; top: 0; bottom: 0; z-index: 6; box-shadow: 8px 0 24px #0002; display: none; }
.runs-overlay.open { display: block; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.facts { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; align-items: flex-end; }
.facts div b { display: block; font-size: 14px; } .facts div span { color: var(--muted); font-size: 11.5px; }
.resultbar { margin-top: 10px; border: 1px solid #bbf7d0; background: #f0fdf4; border-radius: 8px; padding: 8px 12px; line-height: 1.5; }
.resultbar summary { cursor: pointer; list-style: none; } .resultbar summary::-webkit-details-marker { display: none; }
.resultbar .more { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 12.5px; }
.cols { flex: 1; display: flex; min-height: 0; }
.list { width: 390px; flex-shrink: 0; overflow: auto; border-right: 1px solid var(--border); padding: 8px 10px 40px; }
.list-h { display: flex; align-items: center; gap: 6px; padding: 4px 4px 8px; }
.ex { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; align-items: start; }
.ex:hover { background: var(--soft); } .ex.sel { background: var(--sel); box-shadow: inset 2px 0 0 var(--sel-b); }
.ex.dim { display: none; }
.ex .idx { color: var(--muted); font-size: 11px; text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.ex .name { font-weight: 500; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ex .sum { color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ex .right { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.ex .child { margin-top: 3px; font-size: 11.5px; color: var(--muted); } .ex .child a { color: #4f46e5; }
.route { font-size: 11px; color: var(--warn); padding: 0 8px 4px 40px; }
.route.dim { display: none; }
.graph { width: 440px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: radial-gradient(#e4e4e7 1px, transparent 1px) 0 0 / 16px 16px; }
.graph.hidden { display: none; }
.graph-h { white-space: nowrap; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fffc; border-bottom: 1px solid var(--border); font-size: 12px; }
.graph svg { flex: 1; width: 100%; min-height: 0; }
.detail { flex: 1; overflow: auto; padding: 14px 20px 40px; background: var(--card); min-width: 0; }
.vtabs { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.vtabs .v { border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
.vtabs .v.on { background: var(--fg); color: #fff; border-color: var(--fg); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 14px 0 12px; }
.tabs a { padding: 6px 10px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs a.on { color: var(--fg); border-bottom-color: var(--fg); }
.node rect { fill: #fff; stroke: #d4d4d8; stroke-width: 1.2; }
.node text { font-size: 12px; fill: #18181b; } .node .meta { font-size: 10.5px; fill: #71717a; }
.node.visited rect { stroke: #86efac; } .node.hasfail rect { stroke: #fcd34d; }
.node.focus rect { fill: #eef2ff; }
.node.cur rect { stroke: #18181b; stroke-width: 2.2; }
.node.future rect { fill: #fafafa; stroke-dasharray: 4 3; } .node.future text { fill: #a1a1aa; }
.node { cursor: pointer; }
.node .cnt { fill: #18181b; } .node .cnt-t { fill: #fff; font-size: 10px; font-weight: 700; }
.edge { fill: none; stroke: #d4d4d8; stroke-width: 1.5; }
.edge.used { stroke: #71717a; } .edge.last { stroke: #4f46e5; stroke-width: 2.5; }
.elabel { font-size: 10.5px; fill: #71717a; } .ecount { font-size: 10.5px; font-weight: 700; fill: #18181b; }
.toggle { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; user-select: none; }
.keys { font-size: 11px; color: var(--muted); }
kbd { font-family: inherit; font-size: 10.5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }
</style></head>
<body>
<div class="proto-banner"><b>Proposal E · Visit list + graph</b><span>A combined with C, plus D's report header. Every node execution is “visit n of x”. Selecting a visit in the list, the graph or the visit picker keeps all three in sync.</span><a href="index.html" style="margin-left:auto">← Audit and all proposals</a></div>
<script src="data.js"></script>
<script>document.write(renderNav())</script>
<div class="body">
  <div class="rail"><button class="btn" id="runsbtn" title="Runs (R)">☰</button><button class="btn" id="graphbtn" title="Toggle graph (G)">◇</button></div>
  <aside class="runs-list runs-overlay" id="runs"><script>document.write(runsListHtml())</script></aside>
  <div class="main">
    <div class="runhead">
      <h1><span id="title"></span><span class="pill ok">Completed</span>
        <span class="actions"><button class="btn">Open diff</button><button class="btn">Re-run</button><button class="btn" id="contbtn">Continue from this visit</button><button class="btn">⋯</button></span></h1>
      <div class="facts" id="facts"></div>
      <details class="resultbar" id="result"></details>
    </div>
    <div class="cols">
      <div class="list" id="list"></div>
      <div class="graph" id="graph">
        <div class="graph-h"><b>Flow</b><span class="muted" id="gcap"></span>
          <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
            <label class="toggle" title="Show counts and reached nodes as they were at the selected visit"><input type="checkbox" id="asof"> as of selected visit</label>
            <button class="btn" id="play" style="padding:1px 8px">▶ Replay</button></span></div>
        <svg id="g" viewBox="0 0 480 610" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="detail" id="detail"></div>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id)
$('title').textContent = RUN.objective
const implN = visitsOf('implement').length
$('facts').innerHTML = `
  <div><b>1h 7m</b><span>Yesterday ${RUN.started} → ${RUN.ended}</span></div>
  <div><b>${EXECUTIONS.length} visits</b><span>across ${NODES.length} nodes</span></div>
  <div><b>Implement ×${implN}</b><span>Evaluate sent it back twice, Validate once</span></div>
  <div><b>${fmtTok(RUN.tokens + RUN.childTokens)}</b><span>tokens incl. 4 child runs · unpriced</span></div>
  <div><b class="mono" style="font-size:13px">${RUN.commit.slice(0, 8)}</b><span>commit on run branch</span></div>
  <div class="mono muted" style="font-size:11px;margin-left:auto">${RUN.flowLabel} · ${RUN.id}</div>`
$('result').innerHTML = `<summary><b>Result.</b> ${RUN.result[0][1]} <span style="color:#15803d">Details ▾</span></summary>
  <div class="more"><div>${RUN.result.slice(1).map(([k, v]) => `<p style="margin:0 0 6px"><b>${k}:</b> ${v}</p>`).join('')}</div>
  <div><b>Review findings</b>
    <p style="margin:4px 0">1. Effort strings lowercased before dispatch. <a data-go="5" style="color:#15803d;cursor:pointer">fixed in Implement visit 2 ›</a></p>
    <p style="margin:4px 0">2. Discovery ignores spark.toml provider config. <a data-go="12" style="color:#15803d;cursor:pointer">fixed in Implement visit 4 ›</a></p>
    <p style="margin:4px 0">3. Flaky WouldBlock in socket test helpers. <a data-go="10" style="color:#15803d;cursor:pointer">fixed in Implement visits 3–4 ›</a></p></div></div>`

let selected = 11, focusNode = null, asOf = false, timer = null

// ---- list ----
function drawList() {
  const L = $('list')
  const shown = focusNode ? visitsOf(focusNode).length : EXECUTIONS.length
  let html = `<div class="list-h"><b>${focusNode ? nodeById[focusNode].label : 'All visits'}</b><span class="muted small">${shown}</span>
    ${focusNode ? '<button class="btn" id="clr" style="padding:0 8px;margin-left:4px">Show all</button>' : ''}
    <span class="keys" style="margin-left:auto"><kbd>j</kbd><kbd>k</kbd> step · <kbd>←</kbd><kbd>→</kbd> same node</span></div>`
  for (const x of EXECUTIONS) {
    const n = nodeById[x.node], o = OUTCOME[x.outcome], dim = focusNode && focusNode !== x.node
    html += `<div class="ex ${x.i === selected ? 'sel' : ''} ${dim ? 'dim' : ''}" data-i="${x.i}">
      <div class="idx">${x.i + 1}</div>
      <div><div class="name">${n.label}${visitLabel(x) ? `<span class="visit">visit ${visitLabel(x)}</span>` : ''}${x.outcome !== 'success' ? `<span class="pill ${o.cls}">${outcomeLabel(x)}</span>` : ''}</div>
      ${x.summary ? `<div class="sum">${esc(x.summary)}</div>` : ''}
      ${x.child ? `<div class="child">↳ child run <a>${x.child.flow} · ${x.child.id}</a> · ${fmtTok(x.child.tokens)} tok</div>` : ''}</div>
      <div class="right">${dur(x.s, x.e)}<br><span class="tiny">${x.s}</span></div></div>`
    if (x.route === 'Fix') {
      const next = EXECUTIONS[x.i + 1]
      html += `<div class="route ${dim ? 'dim' : ''}">↺ Fix → ${nodeById[next.node].label}${visitLabel(next) ? ` visit ${visitLabel(next)}` : ''}</div>`
    }
  }
  L.innerHTML = html
  L.querySelectorAll('.ex').forEach(el => el.onclick = () => select(+el.dataset.i))
  const c = $('clr'); if (c) c.onclick = () => { focusNode = null; draw() }
  L.querySelector('.ex.sel')?.scrollIntoView({ block: 'nearest' })
}

// ---- graph ----
const POS = {
  start: [190, 28], normalize_task: [190, 88], prepare_workspace: [190, 148], implement: [190, 226], evaluate: [190, 310],
  validate: [190, 394], finalize_commit: [190, 466], cleanup_workspace: [190, 526], done: [190, 586],
  diagnose_validation: [385, 310], count_validate_attempt: [385, 394],
}
const W = 160, H = 38
function edgePath(a, b) {
  const [ax, ay] = POS[a], [bx, by] = POS[b]
  if (a === 'evaluate' && b === 'implement') return `M ${ax - W / 2} ${ay} C ${ax - W / 2 - 70} ${ay}, ${bx - W / 2 - 70} ${by}, ${bx - W / 2} ${by}`
  if (a === 'diagnose_validation' && b === 'implement') return `M ${ax} ${ay - H / 2} C ${ax} ${by}, ${bx + W / 2 + 40} ${by}, ${bx + W / 2} ${by}`
  if (ay === by) return `M ${ax + W / 2} ${ay} L ${bx - W / 2} ${by}`
  if (ax !== bx) return `M ${ax} ${ay - H / 2} L ${bx} ${by + H / 2}`
  return `M ${ax} ${ay + H / 2} L ${bx} ${by - H / 2}`
}
function labelPos(a, b) {
  const [ax, ay] = POS[a], [bx, by] = POS[b]
  if (a === 'evaluate' && b === 'implement') return [ax - W / 2 - 74, (ay + by) / 2 + 4]
  if (a === 'diagnose_validation' && b === 'implement') return [ax - 44, by - 6]
  if (ay === by) return [(ax + bx) / 2 - 14, ay - 6]
  if (ax !== bx) return [bx + 8, (ay + by) / 2]
  return [ax + 8, (ay + by) / 2 + 4]
}
const SHORT = { success: 'succeeded', fail: 'sent back', error: 'failed' }
function drawGraph() {
  const upto = asOf ? selected : EXECUTIONS.length - 1
  const seen = EXECUTIONS.slice(0, upto + 1), cur = EXECUTIONS[selected]
  const t = {}
  for (let k = 1; k < seen.length; k++) { const key = seen[k - 1].node + '>' + seen[k].node; t[key] = (t[key] || 0) + 1 }
  const lastKey = selected > 0 ? EXECUTIONS[selected - 1].node + '>' + cur.node : ''
  let svg = '<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>'
  for (const [a, b, lbl] of EDGES) {
    const key = a + '>' + b, n = t[key] || 0
    svg += `<path class="edge ${n ? 'used' : ''} ${key === lastKey ? 'last' : ''}" d="${edgePath(a, b)}" marker-end="url(#ar)"/>`
    const [lx, ly] = labelPos(a, b)
    if (lbl) svg += `<text class="elabel" x="${lx}" y="${ly}">${lbl}</text>`
    if (n > 1) svg += `<text class="ecount" x="${lx + (lbl ? lbl.length * 6 + 4 : 0)}" y="${ly}">×${n}</text>`
  }
  for (const n of NODES) {
    const [x, y] = POS[n.id], vs = seen.filter(e => e.node === n.id)
    const fails = vs.filter(e => e.outcome !== 'success').length, total = visitsOf(n.id).length
    const isCur = cur.node === n.id
    const cls = ['node', vs.length ? 'visited' : 'future', fails ? 'hasfail' : '', isCur ? 'cur' : '', focusNode === n.id ? 'focus' : ''].join(' ')
    const meta = !vs.length ? 'not reached yet'
      : isCur ? `${total > 1 ? `visit ${visitNo(cur)} of ${total} · ` : ''}${SHORT[cur.outcome]}`
      : `${vs.length > 1 ? `${vs.length} visits · ` : ''}last ${SHORT[vs[vs.length - 1].outcome]}`
    svg += `<g class="${cls}" data-n="${n.id}"><rect x="${x - W / 2}" y="${y - H / 2}" width="${W}" height="${H}" rx="7"/>
      <text x="${x - W / 2 + 10}" y="${y - 3}">${n.label}${n.kind === 'subflow' ? ' ⧉' : ''}</text><text class="meta" x="${x - W / 2 + 10}" y="${y + 12}">${meta}</text>
      ${vs.length > 1 ? `<circle class="cnt" cx="${x + W / 2 - 3}" cy="${y - H / 2 + 1}" r="9"/><text class="cnt-t" x="${x + W / 2 - 3}" y="${y - H / 2 + 4.5}" text-anchor="middle">${vs.length}</text>` : ''}</g>`
  }
  $('g').innerHTML = svg
  $('gcap').textContent = asOf ? `as of visit ${selected + 1} of ${EXECUTIONS.length}` : 'whole run'
  $('g').querySelectorAll('.node').forEach(el => el.onclick = () => {
    const id = el.dataset.n, vs = visitsOf(id)
    if (!vs.length) return
    focusNode = focusNode === id ? null : id
    if (focusNode && EXECUTIONS[selected].node !== id) selected = vs[0].i
    draw()
  })
}

// ---- detail ----
function drawDetail() {
  const x = EXECUTIONS[selected], n = nodeById[x.node], o = OUTCOME[x.outcome], sib = visitsOf(x.node)
  const prev = EXECUTIONS[x.i - 1], next = EXECUTIONS[x.i + 1]
  $('detail').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0;font-size:16px">${n.label}</h2>
      ${sib.length > 1 ? `<span class="visit">visit ${visitLabel(x)}</span>` : ''}<span class="pill ${o.cls}">${outcomeLabel(x)}</span>
      <span class="muted small">${x.s}–${x.e} · ${dur(x.s, x.e)}</span></div>
    ${sib.length > 1 ? `<div class="vtabs">${sib.map((v, k) => `<span class="v ${v === x ? 'on' : ''}" data-i="${v.i}" title="${outcomeLabel(v)}">Visit ${k + 1} ${v.outcome === 'success' ? '✓' : '↺'}</span>`).join('')}</div>` : ''}
    <div class="small muted" style="margin-top:10px">${prev ? `From <a data-i="${prev.i}" style="cursor:pointer;color:#4f46e5">${nodeById[prev.node].label}${visitLabel(prev) ? ' visit ' + visitNo(prev) : ''}</a>` : 'Run start'}
      ${next ? ` · next <a data-i="${next.i}" style="cursor:pointer;color:#4f46e5">${nodeById[next.node].label}${visitLabel(next) ? ' visit ' + visitNo(next) : ''}</a>${x.route ? ` via <b>${x.route}</b>` : ''}` : ''}</div>
    ${x.summary ? `<div class="callout ${o.cls}" style="margin-top:12px">${esc(x.summary)}</div>` : ''}
    ${x.child ? `<div class="section-label">Child run</div><div class="small">${x.child.flow} · <span class="mono">${x.child.id}</span> · ${dur(x.child.s, x.child.e)} · ${fmtTok(x.child.tokens)} tokens · <a style="color:#4f46e5">open its visits ›</a></div>` : ''}
    <div class="tabs"><a class="on">Transcript</a><a>Prompt</a><a>Response</a><a>Context changes</a><a>Raw events</a></div>
    ${renderTranscript(x.i)}`
  $('detail').querySelectorAll('[data-i]').forEach(el => el.onclick = () => select(+el.dataset.i))
  $('contbtn').textContent = `Continue from ${n.label}${sib.length > 1 ? ' visit ' + visitNo(x) : ''}`
}

function select(i) { selected = i; if (focusNode && EXECUTIONS[i].node !== focusNode) focusNode = null; draw() }
function draw() { drawList(); drawGraph(); drawDetail() }

$('asof').onchange = (e) => { asOf = e.target.checked; drawGraph() }
$('play').onclick = () => {
  if (timer) { clearInterval(timer); timer = null; $('play').textContent = '▶ Replay'; return }
  asOf = true; $('asof').checked = true; focusNode = null
  if (selected >= EXECUTIONS.length - 1) selected = 0
  $('play').textContent = '❚❚ Pause'; draw()
  timer = setInterval(() => { if (selected >= EXECUTIONS.length - 1) return $('play').click(); selected++; draw() }, 650)
}
$('runsbtn').onclick = () => $('runs').classList.toggle('open')
$('graphbtn').onclick = () => $('graph').classList.toggle('hidden')
document.querySelectorAll('[data-go]').forEach(el => el.onclick = (e) => { e.preventDefault(); select(+el.dataset.go) })
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return
  const x = EXECUTIONS[selected], sib = visitsOf(x.node), k = sib.indexOf(x)
  const order = focusNode ? visitsOf(focusNode) : EXECUTIONS, p = order.indexOf(x)
  if (e.key === 'j' && p < order.length - 1) select(order[p + 1].i)
  if (e.key === 'k' && p > 0) select(order[p - 1].i)
  if (e.key === 'ArrowRight' && k < sib.length - 1) select(sib[k + 1].i)
  if (e.key === 'ArrowLeft' && k > 0) select(sib[k - 1].i)
  if (e.key === 'g') $('graph').classList.toggle('hidden')
  if (e.key === 'r') $('runs').classList.toggle('open')
  if (e.key === 'Escape') { focusNode = null; $('runs').classList.remove('open'); draw() }
})
draw()
</script>
</body></html>
